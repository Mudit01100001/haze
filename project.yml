name: Haze
options:
  bundleIdPrefix: com.mudit
  deploymentTarget:
    macOS: 26.0

targets:
  Haze:
    type: application
    platform: macOS
    sources:
      - path: Sources/Haze
        excludes:
          - Info.plist # we link it via info.plist path below
    info:
      path: Sources/Haze/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: "" # Can be set later for signing
